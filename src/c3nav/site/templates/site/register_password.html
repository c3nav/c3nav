{% include "django/forms/widgets/input.html" %}
<button type="button" id="show-password">Show passwords</button>
<script>
document.getElementById("show-password").addEventListener("click", e => {
    const passwordInput1 = document.getElementById("id_password1");
    const passwordInput2 = document.getElementById("id_password2");
    if ("password" === passwordInput1.type) {
        passwordInput1.type = "text";
        passwordInput2.type = "text";
        e.target.textContent = "Hide passwords";
    } else {
        passwordInput1.type = "password";
        passwordInput2.type = "password";
        e.target.textContent = "Show passwords";
    }
  });
</script>
