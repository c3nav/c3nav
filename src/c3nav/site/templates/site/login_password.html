{% include "django/forms/widgets/input.html" %}
<button type="button" id="show-password">Show password</button>
<script>
document.getElementById("show-password").addEventListener("click", e => {
    const passwordInput = document.getElementById("id_password");
    if ("password" === passwordInput.type) {
        passwordInput.type = "text";
        e.target.textContent = "Hide password";
    } else {
        passwordInput.type = "password";
        e.target.textContent = "Show password";
    }
  });
</script>
